name: Experimental Session Keepalive

on:
  push:
    branches:
      - experimental/session-keepalive

permissions:
  contents: read

concurrency:
  group: experimental-session-keepalive
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/_quality.yml
    with:
      ref: ${{ github.sha }}

  image:
    needs: quality
    if: github.repository == 'zyycn/codex-proxy-rs'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      CPR_IMAGE: ghcr.io/zyycn/codex-proxy-rs:experimental-session-keepalive-${{ github.sha }}
      TRIVY_QUIET: 'true'
      TRIVY_SKIP_VERSION_CHECK: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Define experimental build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(ruby -ryaml -e 'puts YAML.load_file("release/version.yaml").fetch("version").delete_prefix("v")')"
          echo "version=${version}-session-keepalive.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Cache Cargo mounts
        id: cargo-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/container-cargo
          key: container-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/Cargo.lock', 'backend/**/Cargo.toml', 'deploy/Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            container-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/Cargo.lock', 'backend/**/Cargo.toml', 'deploy/Dockerfile') }}-
            container-cargo-v1-${{ runner.os }}-${{ runner.arch }}-

      # The GHA layer exporter does not persist RUN --mount=type=cache contents.
      # Extraction runs before actions/cache saves its directories in post steps.
      - name: Restore Cargo mounts to BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          scratch-dir: ${{ runner.temp }}/container-cache-dance
          cache-map: |
            {
              "${{ runner.temp }}/container-cargo/registry": "/usr/local/cargo/registry",
              "${{ runner.temp }}/container-cargo/git": "/usr/local/cargo/git",
              "${{ runner.temp }}/container-cargo/target": "/app/backend/target"
            }
          skip-extraction: ${{ steps.cargo-cache.outputs.cache-hit }}

      - name: Build runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          load: true
          tags: ${{ env.CPR_IMAGE }}
          build-args: |
            CPR_VERSION=${{ steps.metadata.outputs.version }}
            CPR_GIT_SHA=${{ github.sha }}
            CPR_BUILD_TIME=${{ steps.metadata.outputs.build_time }}
            CPR_BUILD_TYPE=experimental
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          no-cache-filters: |
            runtime-base
            runtime
          cache-from: type=gha,scope=experimental-session-keepalive
          cache-to: type=gha,mode=max,scope=experimental-session-keepalive

      - name: Verify runtime image
        uses: ./.github/actions/verify-container
        with:
          image: ${{ env.CPR_IMAGE }}
          platform: linux/amd64
          artifact-name: container-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-amd64

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified experimental image
        shell: bash
        run: |
          set -euo pipefail
          docker push "$CPR_IMAGE"
          {
            echo '### 会话保活实验构建'
            echo "镜像：\`$CPR_IMAGE\`"
            echo '平台：linux/amd64；使用独立数据目录，手动更新。'
          } >> "$GITHUB_STEP_SUMMARY"
