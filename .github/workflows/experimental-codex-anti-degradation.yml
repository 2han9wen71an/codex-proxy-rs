name: Experimental Codex Anti-Degradation

on:
  push:
    branches:
      - experimental/codex-anti-degradation

permissions:
  contents: read

concurrency:
  group: experimental-codex-anti-degradation
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/_quality.yml
    with:
      ref: ${{ github.sha }}
